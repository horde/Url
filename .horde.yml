---
id: Url
name: Url
full: URL library
description: >-
  A library that provides URL objects and methods for manipulating URLs,
  including a bridge from/to PSR-7 uris
list: dev
type: library
homepage: https://www.horde.org/libraries/Horde_Url
authors:
  - name: Jan Schneider
    user: jan
    email: jan@horde.org
    active: true
    role: lead
  - name: Michael Slusarz
    user: slusarz
    email: slusarz@horde.org
    active: false
    role: lead
version:
  release: 3.0.0
  api: 3.0.0alpha1
state:
  release: stable
  api: alpha
license:
  identifier: LGPL-2.1-only
  uri: http://www.horde.org/licenses/lgpl21
dependencies:
  required:
    php: ^8.1
    composer:
      horde/exception: ^3
  optional:
    composer:
      horde/http: ^3
      psr/http-message: For PSR-7 interoperability via Psr7Bridge
keywords:
  - uri
  - psr-7
vendor: horde

quality:
  phpstan:
    level: 5
ci-platform:
  '8.1':
    - php: ^7.4 || ^8
  '8.2':
    - php: ^7.4 || ^8
  '8.3':
    - php: ^7.4 || ^8
  '8.4':
    - php: ^7.4 || ^8
  '8.5':
    - php: ^7.4 || ^8
  '8.6':
    - php: ^7.4 || ^8
ci-platform-flags:
  needs_installer_plugin: false
